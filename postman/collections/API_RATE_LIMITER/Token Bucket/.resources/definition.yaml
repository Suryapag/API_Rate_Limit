description: |-
  ## 1\. Why Token Bucket over Fixed Window (quick contrast, since you just built Fixed Window)

  |  | Fixed Window | Token Bucket |
  | --- | --- | --- |
  | Burst handling | Allows 2x burst at window edges (boundary problem) | Smooths bursts — controlled by bucket capacity |
  | Refill model | Resets counter every window | Continuously refills tokens at a fixed rate |
  | Real-world use | Simple APIs, low stakes | Stripe API, AWS API Gateway, Razorpay |
  | Memory | 1 counter per key | 1 (tokens, lastRefillTimestamp) pair per key |

  Token Bucket = a bucket holds tokens (max = capacity). Every request consumes 1 token. Tokens refill continuously at `refillRate` tokens/sec. If bucket is empty → reject (429).

