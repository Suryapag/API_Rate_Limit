  ## 3\. Package structure (MNC convention)

  ```
  com.montbleu.ratelimiter
   ├── config/
   │    └── RateLimiterConfig.java       (bean wiring, @ConfigurationProperties)
   ├── core/
   │    ├── TokenBucket.java             (the actual bucket — thread-safe state)
   │    └── RateLimiterService.java      (business logic: tryConsume, bucket lookup)
   ├── filter/ or interceptor/
   │    └── RateLimitInterceptor.java    (intercepts HTTP requests, applies limiter)
   ├── web/
